name: Bug report
description: Report a reproducible problem with DSH IDE
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Please remove API keys, tokens, private paths, and customer code before submitting.
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: 0.2.1-rc.5
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Browser console, DSH host log, or terminal output. Remove secrets first.
      render: shell
    validations:
      required: false
